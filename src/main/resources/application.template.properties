spring.application.name=complaint-management-system

# ====================== MySQL Database ======================
spring.datasource.url=jdbc:mysql://localhost:3306/society_complaint_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=MYSQL_PASSWORD
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ====================== JPA / Hibernate ======================
# update = auto-creates/updates tables on startup based on entities (fine for a resume project/demo)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ====================== Mail (Gmail SMTP) ======================
# IMPORTANT: Do NOT use your normal Gmail password.
# Generate a 16-character "App Password" from your Google Account:
# Google Account -> Security -> 2-Step Verification -> App Passwords
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=YOUR_GMAIL@gmail.com
spring.mail.password=YOUR_APP_PASSWORD
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Set to false to disable real email sending (logs to console instead) - handy if SMTP isn't set up yet
app.mail.enabled=true

# ====================== Default Admin (seeded on first startup only) ======================
# A single admin account is created automatically the first time the app runs,
# IF no admin already exists in the database. Change these before your first run,
# or change the password after logging in. Additional admins should be created
# from the Admin > Manage Admins screen, not through public registration.
app.default-admin.email=YOUR_GMAIL@gmail.com
app.default-admin.password=YOUR_APP_PASSWORD

# ====================== Server ======================
server.port=8080

# ====================== Logging ======================
logging.level.com.society.complaint=INFO
logging.level.org.springframework.security=INFO
logging.level.org.springframework.mail=DEBUG
logging.level.org.springframework.scheduling=DEBUG
logging.level.org.springframework.aop.interceptor=DEBUG