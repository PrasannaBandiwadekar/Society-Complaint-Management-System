<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Add Admin — Society Complaints</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650;700&display=swap" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>

<div class="app-shell">
    <div th:replace="~{fragments/sidebar :: sidebar('admins')}"></div>

    <main class="main-content">
        <div class="topbar">
            <div style="display:flex; align-items:center;">
                <div class="mobile-toggle" onclick="toggleSidebar()">&#9776;</div>
                <div>
                    <a th:href="@{/admin/admins}" style="font-size:13px; color:var(--text-2);">&larr; Back to admins</a>
                    <h1 class="page-title" style="margin-top:4px;">Add a new admin</h1>
                </div>
            </div>
        </div>

        <div class="panel" style="max-width: 560px;">
            <div class="panel-body">
                <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

                <form th:action="@{/admin/admins/new}" th:object="${adminCreateDto}" method="post">

                    <div style="margin-bottom:16px;">
                        <label class="form-label">Full name</label>
                        <input type="text" th:field="*{fullName}" class="form-control" placeholder="Jane Doe">
                        <div class="field-error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
                    </div>

                    <div style="margin-bottom:16px;">
                        <label class="form-label">Email</label>
                        <input type="email" th:field="*{email}" class="form-control" placeholder="admin2@society.com">
                        <div class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                    </div>

                    <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:20px;">
                        <div>
                            <label class="form-label">Password</label>
                            <input type="password" th:field="*{password}" class="form-control" placeholder="At least 6 characters">
                            <div class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                        </div>
                        <div>
                            <label class="form-label">Phone number</label>
                            <input type="text" th:field="*{phoneNumber}" class="form-control" placeholder="9876543210">
                            <div class="field-error" th:if="${#fields.hasErrors('phoneNumber')}" th:errors="*{phoneNumber}"></div>
                        </div>
                    </div>

                    <!-- role is fixed to ADMIN server-side in UserServiceImpl.createAdmin();
                         no role field is exposed here since there's nothing to choose. -->

                    <div class="gap-form">
                        <button type="submit" class="btn btn-primary">Create admin account</button>
                        <a th:href="@{/admin/admins}" class="btn btn-outline">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </main>
</div>

<script th:src="@{/js/app.js}"></script>
</body>
</html>
