<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admins — Society Complaints</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650;700&display=swap" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>

<div class="app-shell">
    <div th:replace="~{fragments/sidebar :: sidebar('admins')}"></div>

    <main class="main-content">
        <div class="topbar">
            <div style="display:flex; align-items:center;">
                <div class="mobile-toggle" onclick="toggleSidebar()">&#9776;</div>
                <div>
                    <a th:href="@{/admin/dashboard}" style="font-size:13px; color:var(--text-2);">&larr; Back to dashboard</a>
                    <h1 class="page-title" style="margin-top:4px;">Admin Accounts</h1>
                    <p class="page-subtitle">Admins are provisioned here, not through public self-registration</p>
                </div>
            </div>
            <a th:href="@{/admin/admins/new}" class="btn btn-primary">+ Add admin</a>
        </div>

        <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>

        <div class="panel">
            <div class="panel-body flush">
                <table class="data-table">
                    <thead>
                    <tr>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Phone</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="a : ${admins}">
                        <td th:text="${a.fullName}"></td>
                        <td th:text="${a.email}"></td>
                        <td th:text="${a.phoneNumber}"></td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</div>

<script th:src="@{/js/app.js}"></script>
</body>
</html>
