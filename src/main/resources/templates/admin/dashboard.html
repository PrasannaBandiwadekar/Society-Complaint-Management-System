<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin Dashboard — Society Complaints</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650;700&display=swap" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>

<div class="app-shell">
    <div th:replace="~{fragments/sidebar :: sidebar('dashboard')}"></div>

    <main class="main-content">
        <div class="topbar">
            <div style="display:flex; align-items:center;">
                <div class="mobile-toggle" onclick="toggleSidebar()">&#9776;</div>
                <div>
                    <h1 class="page-title">Admin Dashboard</h1>
                    <p class="page-subtitle">Society-wide view of all maintenance complaints</p>
                </div>
            </div>
        </div>

        <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>

        <div class="stat-grid" style="grid-template-columns: repeat(6, 1fr);" id="adminStatGrid">
            <div class="stat-card">
                <div class="stat-label">Total</div>
                <div class="stat-value c-neutral" th:text="${totalCount}"></div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Open</div>
                <div class="stat-value c-neutral" th:text="${openCount}"></div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Assigned</div>
                <div class="stat-value c-accent" th:text="${assignedCount}"></div>
            </div>
            <div class="stat-card">
                <div class="stat-label">In progress</div>
                <div class="stat-value c-warning" th:text="${inProgressCount}"></div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Resolved</div>
                <div class="stat-value c-success" th:text="${resolvedCount}"></div>
            </div>
            <a th:href="@{/admin/complaints/overdue}" style="text-decoration:none;">
                <div class="stat-card clickable">
                    <div class="stat-label">Overdue</div>
                    <div class="stat-value c-danger" th:text="${overdueCount}"></div>
                </div>
            </a>
        </div>

        <style>
            @media (max-width: 1100px) { #adminStatGrid { grid-template-columns: repeat(3, 1fr) !important; } }
            @media (max-width: 600px) { #adminStatGrid { grid-template-columns: repeat(2, 1fr) !important; } }
        </style>

        <div class="panel">
            <div class="panel-header">All Complaints</div>
            <div class="panel-body flush">
                <div th:if="${complaints.isEmpty()}" class="empty-state">
                    <div class="icon">&#128203;</div>
                    <div>No complaints have been raised yet.</div>
                </div>
                <table class="data-table" th:unless="${complaints.isEmpty()}">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Title</th>
                        <th>Resident</th>
                        <th>Worker</th>
                        <th>Priority</th>
                        <th>Status</th>
                        <th>Raised on</th>
                        <th></th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="c : ${complaints}" th:class="${c.overdue} ? 'row-overdue' : ''">
                        <td th:text="${'#' + c.id}"></td>
                        <td th:text="${c.title}"></td>
                        <td th:text="${c.resident.fullName}"></td>
                        <td th:text="${c.worker != null ? c.worker.fullName : '—'}"></td>
                        <td><span th:replace="~{fragments/badges :: priorityBadge(${c.priority})}"></span></td>
                        <td>
                            <span th:replace="~{fragments/badges :: statusBadge(${c.status})}"></span>
                            <span th:if="${c.overdue}" th:replace="~{fragments/badges :: overdueBadge}"></span>
                        </td>
                        <td th:text="${#temporals.format(c.createdAt, 'dd MMM, hh:mm a')}"></td>
                        <td>
                            <a th:href="@{/admin/complaints/{id}(id=${c.id})}" class="btn btn-outline btn-sm">Manage</a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</div>

<script th:src="@{/js/app.js}"></script>
</body>
</html>
