<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Manage Complaint — Society Complaints</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650;700&display=swap" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>

<div class="app-shell">
    <div th:replace="~{fragments/sidebar :: sidebar('dashboard')}"></div>

    <main class="main-content">
        <div class="topbar">
            <div style="display:flex; align-items:center;">
                <div class="mobile-toggle" onclick="toggleSidebar()">&#9776;</div>
                <div>
                    <a th:href="@{/admin/dashboard}" style="font-size:13px; color:var(--text-2);">&larr; Back to dashboard</a>
                    <h1 class="page-title" style="margin-top:4px;">Complaint #<span th:text="${complaint.id}"></span></h1>
                </div>
            </div>
        </div>

        <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>

        <div class="two-col">
            <div>
                <div class="panel" style="margin-bottom:18px;">
                    <div class="panel-header">
                        <span th:text="${complaint.title}"></span>
                        <div>
                            <span th:replace="~{fragments/badges :: statusBadge(${complaint.status})}"></span>
                            <span th:if="${complaint.overdue}" th:replace="~{fragments/badges :: overdueBadge}"></span>
                        </div>
                    </div>
                    <div class="panel-body">
                        <p style="margin-top:0; color:var(--text-2);" th:text="${complaint.description}"></p>
                        <hr style="border-color:var(--border); margin: 16px 0;">
                        <div class="meta-grid">
                            <div>
                                <div class="meta-label">Category</div>
                                <div class="meta-value" th:text="${complaint.category}"></div>
                            </div>
                            <div>
                                <div class="meta-label">Priority</div>
                                <div class="meta-value"><span th:replace="~{fragments/badges :: priorityBadge(${complaint.priority})}"></span></div>
                            </div>
                            <div>
                                <div class="meta-label">Resident</div>
                                <div class="meta-value" th:text="${complaint.resident.fullName}"></div>
                            </div>
                            <div>
                                <div class="meta-label">Flat</div>
                                <div class="meta-value" th:text="${complaint.flatNumber}"></div>
                            </div>
                            <div>
                                <div class="meta-label">Resident phone</div>
                                <div class="meta-value" th:text="${complaint.resident.phoneNumber}"></div>
                            </div>
                            <div>
                                <div class="meta-label">SLA deadline</div>
                                <div class="meta-value" th:text="${#temporals.format(complaint.slaDeadline, 'dd MMM yyyy, hh:mm a')}"></div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="panel" style="margin-bottom:18px;" th:if="${complaint.worker == null}">
                    <div class="panel-header">Assign a worker</div>
                    <div class="panel-body">
                        <form th:action="@{/admin/complaints/{id}/assign(id=${complaint.id})}" method="post" class="gap-form">
                            <select name="workerId" class="form-select" required>
                                <option value="">-- Select worker --</option>
                                <option th:each="w : ${workers}" th:value="${w.id}" th:text="${w.fullName + ' (' + w.specialization + ')'}"></option>
                            </select>
                            <button type="submit" class="btn btn-primary">Assign</button>
                        </form>
                        <div th:if="${workers.isEmpty()}" style="color:var(--text-3); font-size:13px; margin-top:10px;">No workers registered yet.</div>
                    </div>
                </div>

                <div class="panel" style="margin-bottom:18px;" th:if="${complaint.worker != null}">
                    <div class="panel-header">Assigned worker</div>
                    <div class="panel-body">
                        <div class="meta-value" style="font-weight:650;" th:text="${complaint.worker.fullName}"></div>
                        <div style="color:var(--text-2); font-size:13px;" th:text="${complaint.worker.specialization}"></div>
                        <div style="color:var(--text-3); font-size:12.5px; margin-top:4px;" th:text="${complaint.worker.phoneNumber}"></div>
                    </div>
                </div>

                <div class="panel">
                    <div class="panel-header">Update status</div>
                    <div class="panel-body">
                        <form th:action="@{/admin/complaints/{id}/status(id=${complaint.id})}" method="post">
                            <div style="margin-bottom:14px;">
                                <select name="status" class="form-select" required>
                                    <option value="">-- Select new status --</option>
                                    <option value="IN_PROGRESS">In Progress</option>
                                    <option value="RESOLVED">Resolved</option>
                                    <option value="CLOSED">Closed</option>
                                </select>
                            </div>
                            <div style="margin-bottom:14px;">
                                <input type="text" name="remarks" class="form-control" placeholder="Remarks (optional)">
                            </div>
                            <button type="submit" class="btn btn-primary">Update status</button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="panel">
                <div class="panel-header">Status timeline</div>
                <div class="panel-body">
                    <div th:each="h, iter : ${complaint.statusHistory}" class="tl-item">
                        <div class="tl-title" th:text="${h.oldStatus + ' → ' + h.newStatus}"></div>
                        <div class="tl-meta" th:text="${#temporals.format(h.changedAt, 'dd MMM, hh:mm a') + ' · ' + h.changedBy}"></div>
                        <div class="tl-remarks" th:text="${h.remarks}"></div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>

<script th:src="@{/js/app.js}"></script>
</body>
</html>
