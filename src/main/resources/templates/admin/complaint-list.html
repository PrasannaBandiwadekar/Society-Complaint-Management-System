<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${pageTitle} + ' — Society Complaints'">Complaints</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650;700&display=swap" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>

<div class="app-shell">
    <div th:replace="~{fragments/sidebar :: sidebar('overdue')}"></div>

    <main class="main-content">
        <div class="topbar">
            <div style="display:flex; align-items:center;">
                <div class="mobile-toggle" onclick="toggleSidebar()">&#9776;</div>
                <div>
                    <a th:href="@{/admin/dashboard}" style="font-size:13px; color:var(--text-2);">&larr; Back to dashboard</a>
                    <h1 class="page-title" style="margin-top:4px;" th:text="${pageTitle}"></h1>
                </div>
            </div>
        </div>

        <div class="panel">
            <div class="panel-body flush">
                <div th:if="${complaints.isEmpty()}" class="empty-state">
                    <div class="icon">&#127881;</div>
                    <div>No complaints found in this view.</div>
                </div>
                <table class="data-table" th:unless="${complaints.isEmpty()}">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Title</th>
                        <th>Resident</th>
                        <th>Worker</th>
                        <th>SLA deadline</th>
                        <th>Status</th>
                        <th></th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="c : ${complaints}" class="row-overdue">
                        <td th:text="${'#' + c.id}"></td>
                        <td th:text="${c.title}"></td>
                        <td th:text="${c.resident.fullName}"></td>
                        <td th:text="${c.worker != null ? c.worker.fullName : '—'}"></td>
                        <td th:text="${#temporals.format(c.slaDeadline, 'dd MMM, hh:mm a')}"></td>
                        <td><span th:replace="~{fragments/badges :: statusBadge(${c.status})}"></span></td>
                        <td>
                            <a th:href="@{/admin/complaints/{id}(id=${c.id})}" class="btn btn-outline btn-sm">Manage</a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</div>

<script th:src="@{/js/app.js}"></script>
</body>
</html>
