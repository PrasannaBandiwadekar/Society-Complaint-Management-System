# ====================================================================
# CI/CD Pipeline — Society Complaint Management System
#
# Triggers: every push to main, and every pull request against main
#
# What it does step by step:
# 1. Checks out your code
# 2. Sets up Java 17
# 3. Runs the Maven build + unit tests
# 4. (On push to main only) Builds a Docker image
# 5. Pushes the image to Docker Hub
# 6. Triggers a Render deployment via its deploy webhook
# ====================================================================

name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  # ----------------------------------------------------------------
  # JOB 1: BUILD AND TEST
  # Runs on every push and every pull request.
  # Catches broken code before it ever reaches the main branch.
  # ----------------------------------------------------------------
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest  # GitHub provides a free Ubuntu VM for this

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        # Pulls your repo code into the GitHub Actions runner VM

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'   # Eclipse Adoptium (same as your local JDK)
          cache: maven              # caches ~/.m2 between runs so deps don't re-download

      - name: Build with Maven (skip tests for speed, tests run next)
        run: mvn clean install -DskipTests

      - name: Run unit tests
        run: mvn test
        # If any test fails, the whole pipeline stops here and
        # GitHub shows a red ✗ on the commit — nothing deploys.

      - name: Upload test results (visible in GitHub Actions UI)
        uses: actions/upload-artifact@v4
        if: always()   # upload even if tests fail, so you can see the report
        with:
          name: test-results
          path: target/surefire-reports/

  # ----------------------------------------------------------------
  # JOB 2: BUILD AND PUSH DOCKER IMAGE
  # Only runs on push to main (not on pull requests).
  # Waits for build-and-test to succeed first.
  # ----------------------------------------------------------------
  docker-build-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: build-and-test          # won't run if build-and-test fails
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build jar
        run: mvn clean package -DskipTests

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          # DOCKER_USERNAME and DOCKER_PASSWORD are GitHub Secrets
          # Set them at: GitHub repo → Settings → Secrets and variables → Actions

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/society-complaint-system:latest
            ${{ secrets.DOCKER_USERNAME }}/society-complaint-system:${{ github.sha }}
          # Tags the image with both 'latest' and the exact commit SHA
          # so you can always roll back to a specific version

  # ----------------------------------------------------------------
  # JOB 3: DEPLOY TO RENDER
  # Triggers Render's deploy webhook to pull the new Docker image and restart.
  # Waits for the Docker image to be pushed first.
  # ----------------------------------------------------------------
  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: docker-build-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Trigger Render deployment
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
          echo "Deployment triggered on Render"
        # RENDER_DEPLOY_HOOK_URL is found in Render dashboard:
        # Your service → Settings → Deploy Hook → copy the URL
        # Add it as a GitHub Secret named RENDER_DEPLOY_HOOK_URL
